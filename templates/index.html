<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI FAQ Chatbot</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 95%;
            max-width: 750px;
            height: 650px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
        }

        .header p {
            margin: 6px 0 0;
            font-size: 14px;
            opacity: 0.9;
        }

        .clear-button {
            position: absolute;
            right: 15px;
            top: 20px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 7px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .clear-button:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message-row {
            display: flex;
            margin: 12px 0;
            align-items: flex-end;
            gap: 8px;
        }

        .user-row {
            justify-content: flex-end;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .bot-avatar {
            background: #e0e7ff;
        }

        .user-avatar {
            background: #dbeafe;
        }

        .message {
            max-width: 70%;
            padding: 12px 15px;
            border-radius: 16px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }

        .bot {
            background: white;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .user {
            background: #2563eb;
            color: white;
            border-bottom-right-radius: 4px;
        }

        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e5e7eb;
        }

        input {
            flex: 1;
            padding: 13px 15px;
            border: 1px solid #d1d5db;
            border-radius: 25px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #2563eb;
        }

        .send-button {
            padding: 12px 22px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .send-button:hover {
            background: #1d4ed8;
        }

        .thinking {
            color: #6b7280;
            font-style: italic;
        }

        @media (max-width: 600px) {

            .container {
                width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 80%;
            }

            .clear-button {
                position: static;
                margin-top: 10px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">

            <h1>🤖 AI FAQ Chatbot</h1>

            <p>Ask me anything about our services</p>

            <button class="clear-button" onclick="clearChat()">
                🗑️ Clear Chat
            </button>

        </div>


        <div id="chat">

            <div class="message-row">

                <div class="avatar bot-avatar">
                    🤖
                </div>

                <div class="message bot">
                    Hello! 👋 Ask me a question and I'll try to help you.
                </div>

            </div>

        </div>


        <div class="input-area">

            <input
                type="text"
                id="question"
                placeholder="Type your question..."
                onkeydown="handleKey(event)"
            >

            <button class="send-button" onclick="askQuestion()">
                Send
            </button>

        </div>

    </div>


    <script>

        function handleKey(event) {

            if (event.key === "Enter") {
                askQuestion();
            }

        }


        function clearChat() {

            const chat = document.getElementById("chat");

            chat.innerHTML = `
                <div class="message-row">

                    <div class="avatar bot-avatar">
                        🤖
                    </div>

                    <div class="message bot">
                        Hello! 👋 Ask me a question and I'll try to help you.
                    </div>

                </div>
            `;

        }


        async function askQuestion() {

            const input = document.getElementById("question");

            const question = input.value.trim();

            if (!question) {
                return;
            }

            const chat = document.getElementById("chat");


            // Create user message safely

            const userRow = document.createElement("div");

            userRow.className = "message-row user-row";


            const userMessage = document.createElement("div");

            userMessage.className = "message user";

            userMessage.textContent = question;


            const userAvatar = document.createElement("div");

            userAvatar.className = "avatar user-avatar";

            userAvatar.textContent = "👤";


            userRow.appendChild(userMessage);

            userRow.appendChild(userAvatar);

            chat.appendChild(userRow);


            input.value = "";


            // Thinking indicator

            const thinkingRow = document.createElement("div");

            thinkingRow.className = "message-row";

            thinkingRow.id = "thinking";


            const thinkingAvatar = document.createElement("div");

            thinkingAvatar.className = "avatar bot-avatar";

            thinkingAvatar.textContent = "🤖";


            const thinkingMessage = document.createElement("div");

            thinkingMessage.className = "message bot thinking";

            thinkingMessage.textContent = "Thinking...";


            thinkingRow.appendChild(thinkingAvatar);

            thinkingRow.appendChild(thinkingMessage);

            chat.appendChild(thinkingRow);


            chat.scrollTop = chat.scrollHeight;


            try {

                const response = await fetch("/ask", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        question: question
                    })

                });


                const data = await response.json();


                const thinking = document.getElementById("thinking");

                if (thinking) {
                    thinking.remove();
                }


                // Create bot response safely

                const botRow = document.createElement("div");

                botRow.className = "message-row";


                const botAvatar = document.createElement("div");

                botAvatar.className = "avatar bot-avatar";

                botAvatar.textContent = "🤖";


                const botMessage = document.createElement("div");

                botMessage.className = "message bot";

                botMessage.textContent = data.answer;


                botRow.appendChild(botAvatar);

                botRow.appendChild(botMessage);

                chat.appendChild(botRow);


                chat.scrollTop = chat.scrollHeight;


            } catch (error) {

                const thinking = document.getElementById("thinking");

                if (thinking) {
                    thinking.remove();
                }


                const errorRow = document.createElement("div");

                errorRow.className = "message-row";


                const errorAvatar = document.createElement("div");

                errorAvatar.className = "avatar bot-avatar";

                errorAvatar.textContent = "🤖";


                const errorMessage = document.createElement("div");

                errorMessage.className = "message bot";

                errorMessage.textContent =
                    "Sorry, something went wrong. Please try again.";


                errorRow.appendChild(errorAvatar);

                errorRow.appendChild(errorMessage);

                chat.appendChild(errorRow);

                chat.scrollTop = chat.scrollHeight;

            }

        }

    </script>

</body>

</html>
